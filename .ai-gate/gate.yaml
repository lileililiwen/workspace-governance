version: 1
runtime: driftwatchdog
profile: governance
rule_pack: workspace-governance@1
checks:
  repository: true
  build: false
  tests: true
  security: true
  product_quality: true
  declared-verification: true
blocking:
  - FAIL
  - REVIEW_REQUIRED
notes:
  - The product_quality check runs `python3 scripts/product_code_quality.py .` from this repository root.
  - Driftwatchdog Gate bindings are not yet active for this bootstrap; the declaration does not constitute a Gate run.

commands:
  # Generated from .project.json verification.command by workspace-governance/scripts/bind_verification_command.py.
  # A verifier that no gate runs does not gate (ruling D18). Re-run the
  # generator to update it; do not hand-edit.
  declared-verification: 'python3 -m unittest discover -s tests -v'
