name: governance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/workspace_check.py --self-check
      - run: python3 scripts/jenkins_manifest.py --check
      - run: git diff --check
